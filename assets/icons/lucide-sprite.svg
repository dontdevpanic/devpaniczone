<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    
    <!-- ===== CHECK (einfacher Haken) ===== -->
    <symbol id="lucide-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6 9 17l-5-5"/>
    </symbol>
    
    <!-- ===== CIRCLE-CHECK (Haken im Kreis) ===== -->
    <symbol id="lucide-circle-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="m9 12 2 2 4-4"/>
    </symbol>
    
    <!-- ===== X (einfaches Kreuz) ===== -->
