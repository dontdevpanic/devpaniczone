<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex, nofollow" />
        <title>Live Code Editor – Fullscreen | DevPanicZone</title>
        <link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg" />
        <link rel="icon" type="image/png" href="/assets/icons/favicon.png" />
        <link rel="stylesheet" href="/assets/css/variables.css" />
        <link rel="stylesheet" href="/assets/css/js-live-editor-fullscreen.css" />
    </head>

    <body>
        <div class="fs-layout">
            <!-- Panel-Toggle Toolbar -->
            <div class="fs-toolbar">
                <span class="fs-brand">Panels:</span>
                <div class="fs-toolbar-actions">
                    <button class="fs-toggle-btn active" id="fsToggleHtml" aria-pressed="true" data-panel="html">
                        HTML
                    </button>
                    <button class="fs-toggle-btn active" id="fsToggleCss" aria-pressed="true" data-panel="css">
                        CSS
                    </button>
                    <button class="fs-toggle-btn" id="fsToggleJs" aria-pressed="false" data-panel="js">JS</button>
                </div>
            </div>
            <!-- Panels oben -->
            <div class="fs-panels" id="fsPanels">
                <!-- HTML Panel -->
                <div class="fs-panel" id="fsPanelHtml">
                    <div class="fs-panel-header">
                        <span class="fs-panel-lang">HTML</span>
                    </div>
                    <textarea
                        class="fs-textarea"
                        id="fsInputHtml"
                        aria-label="HTML eingeben"
                        spellcheck="false"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        placeholder="<!-- HTML hier eingeben -->"
                    ></textarea>
                </div>

                <!-- CSS Panel -->
                <div class="fs-panel" id="fsPanelCss">
                    <div class="fs-panel-header">
                        <span class="fs-panel-lang">CSS</span>
                    </div>
                    <textarea
                        class="fs-textarea"
                        id="fsInputCss"
                        aria-label="CSS eingeben"
                        spellcheck="false"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        placeholder="/* CSS hier eingeben */"
                    ></textarea>
                </div>

                <!-- JS Panel -->
                <div class="fs-panel hidden" id="fsPanelJs">
                    <div class="fs-panel-header">
                        <span class="fs-panel-lang">JavaScript</span>
                    </div>
                    <textarea
                        class="fs-textarea"
                        id="fsInputJs"
                        aria-label="JavaScript eingeben"
                        spellcheck="false"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        placeholder="// JavaScript hier eingeben"
                    ></textarea>
                </div>
            </div>
            <!-- /fs-panels -->

            <!-- Toolbar -->
            <div class="fs-toolbar">
                <span class="fs-brand">DevPanicZone – Live Editor</span>
                <div class="fs-toolbar-actions">
                    <button class="fs-btn-clear" id="fsBtnClear" aria-label="Editor leeren">✕ Clear</button>
                    <button class="fs-btn-run" id="fsBtnRun" aria-label="Code ausführen">▶ Run</button>
                    <a
                        href="/tutorials/javascript/javascript-projects/js-live-editor-fullscreen.html"
                        id="fsBtnNewTab"
                        target="_blank"
                        class="fs-btn-newtab"
                    >
                        ↗ Fullscreen Tab
                    </a>
                </div>
            </div>

            <!-- Preview unten -->
            <div class="fs-preview">
                <iframe
                    id="fsPreviewFrame"
                    title="Code Preview"
                    sandbox="allow-scripts"
                    aria-label="Vorschau des eingegebenen Codes"
                ></iframe>
            </div>
        </div>
        <!-- /fs-layout -->

        <script src="/assets/js/js-live-editor-fullscreen.js"></script>
    </body>
</html>
